name: Deploy Kodiset frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm exec --yes pnpm@10 -- install --frozen-lockfile

      - name: Build frontend
        env:
          PORT: 5173
          BASE_PATH: /Kodiset/
        run: npm exec --yes pnpm@10 -- --filter @workspace/kodiset run build

      - name: Preserve SPA routes
        run: cp artifacts/kodiset/dist/public/index.html artifacts/kodiset/dist/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/kodiset/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4